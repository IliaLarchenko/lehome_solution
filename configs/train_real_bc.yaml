# Real-robot BC training config (`pi_modified_real_bc`).
#
# THE config for real-round training: pure BC on real teleop + DAgger + sim
# success-replay rollouts, all native (degree units, 20 Hz, real camera
# names). Mirrors config.py::pi_modified_real_bc — values here OVERRIDE the
# base config, so this file is the single place to tune training.
#
# Run:
#   uv run python scripts/train.py --yaml configs/train_real_bc.yaml --resume
#
# Norm stats + FAST tokenizer (recompute when the source list changes; pass
# THIS yaml — the registry entry no longer carries data_sources):
#   uv run python scripts/compute_norm_stats.py   --config-name configs/train_real_bc.yaml --all-sources
#   uv run python scripts/train_fast_tokenizer.py --config-name configs/train_real_bc.yaml --all-sources

# Registered config to start from. Supplies the config *name* (keys the
# assets dir outputs/assets/<name>/ and checkpoint dir
# outputs/checkpoints/<name>/<exp_name>/) and any field not set below.
base_config: pi_modified_real_bc

exp_name: real_bc_v1
project_name: LeHome

# ── Init / schedule ──────────────────────────────────────────────────────
# Sim-trained checkpoint to transfer from (PiModifiedWeightLoader partial
# restore: shape-mismatched / missing keys keep their fresh init). Set to
# null to train from scratch. The published sim policy is the natural start:
#   uv run hf download IliaLarchenko/lehome_sim --local-dir outputs/checkpoints/lehome_sim
init_checkpoint: outputs/checkpoints/lehome_sim/params

lr_schedule:
  warmup_steps: 100000
  peak_lr: 1.0e-4
  decay_steps: 300000
  decay_lr: 1.0e-5

optimizer:
  b1: 0.9
  b2: 0.95
  eps: 1.0e-8
  weight_decay: 1.0e-10
  aux_head_weight_decay: 0.001
  clip_gradient_norm: 1.0

num_train_steps: 50000
batch_size: 192
num_flow_samples: 5
num_workers: 8
save_interval: 500
keep_period: 5000
assets_base_dir: ./outputs/assets
checkpoint_base_dir: ./outputs/checkpoints
wandb_enabled: true
# HF checkpoint auto-upload after every save_state — set to your own repo.
hf_model_repo: <your-hf-username>/<model-repo>

# ── Model ────────────────────────────────────────────────────────────────
model:
  # Aux heads: only garment_type + completion train. use_success_head stays
  # true so the shared query token + linear heads exist (and load from the
  # init checkpoint) - legacy logic; the zero loss weights gate which heads get gradient.
  use_success_head: true
  success_loss_weight: 0.0
  checkpoint_loss_weight: 0.0
  ttc_loss_weight: 0.0
  garment_type_loss_weight: 0.1
  completion_loss_weight: 0.1
  # Keypoint + world-modeling heads not built at all.
  use_keypoint_distance_head: false
  use_wm_fast_head: false
  use_wm_flow_head: false
  use_garment_type_input: true
  # No advantage machinery.
  use_advantage_embedding: false
  # Real data is native — no 180° top-cam flip.
  rotate_top_image: false

  # Training-time image + state augmentations
  # Stronger color jitter bridges the home_real top-cam offset (~40 luma
  # darker, warm R>G>B tint) + sim wrist over-bright; per_camera_color gives
  # independent jitter per camera (different sensors); state noise pushes the
  # model to rely on images over potentially-unreliable proprioception.
  train_aug:
    brightness: 0.25
    contrast: 0.30
    saturation: 0.30
    hue: 0.03
    per_camera_color: true
    per_channel_gain: 0.10
    gamma_range: 0.10
    gauss_blur_sigma: 0.8
    gauss_blur_prob: 0.30
    additive_noise_std: 0.012   # ~3/255 sensor noise
    # Crop + rotate on ALL cameras (per-cam independent RNG) — wrist mounts
    # drift too.
    top_crop_frac: 0.92
    top_rotate_deg: 3.0
    apply_top_geo_to_all_cameras: true
    # Zoom + translate on all cameras (FoV / mount drift).
    zoom_range: 0.05
    translate_px: 10.0
    cutout_prob: 0.30
    cutout_max_area: 0.10
    cam_dropout_prob: 0.05
    state_dropout_prob: 0.05
    state_noise_std: 0.02
    calibration_scale_noise: 0.02

# ── Data ─────────────────────────────────────────────────────────────────
data:
  repo_id: real_bc
  asset_id: real_bc          # fresh asset_id → fresh norm_stats / FAST tokenizer
  use_per_timestamp_norm: true
  # Real-camera source columns: right_front / left_wrist / right_wrist.
  raw_real_camera_mapping: true
  use_delta_joint_actions: true
  use_fast_tokenization: true
  # No advantage anywhere.
  use_advantages: false
  success_label_smoothing: 0.0
  # pct_real is a no-op when bucket_shares is set; keep the safe default.
  pct_real: 0.0

  # Batch mix between buckets. Reasoning: organizer-provided primary_real is
  # the canonical distribution for eval; home_real + DAgger still get a
  # meaningful share; sim rollouts stay at 10% as a regularization mix.
  bucket_shares:
    primary_real: 0.60
    home_real: 0.30
    home_sim: 0.10

  # DAgger per-frame sampling: human-leader frames at full weight,
  # auto-policy frames at 0.3, ramped down to 0.0 in the 5-second window
  # preceding each human intervention.
  dagger_sampling:
    human_weight: 2.0
    auto_weight: 0.3
    pre_intervention_min_weight: 0.0
    pre_intervention_window_seconds: 5.0

  # Sim Pant_Long executes the first half differently from real teleop —
  # skip frames [10, ep_len/2) of every sim Pant_Long episode. Frames 0-9
  # stay (early garment-type signal the inference bootstrap depends on).
  sim_garment_skip:
    garment_type_name: Pant_Long
    first_n_keep: 10
    skip_until_frac: 0.5
    apply_to_buckets: [home_sim]

  # Suppress sampling of frames stuck near the initial home position.
  initial_stuck:
    movement_threshold: 3.0
    position_std_factor: 3.0
    min_position_range: 5.0
    min_leading_frames: 5
    mid_weight: 0.2
    trailing_weight: 0.3
    apply_to_buckets: [primary_real, home_real]

  data_sources:
    # Bucket A: primary real teleop (organizer dataset). No speed rescale
    # (baseline reference).
    - root: data/lehome_real/four_types_merged
      repo_id: primary_real
      is_real: true
      use_for_success_labels: false
      bucket: primary_real
      speed_factor: 1.0
    # Bucket B example — home teleop (slower than primary):
    # - root: data/lehome_real_ds/top_long_001
    #   repo_id: home_top_long_001
    #   is_real: true
    #   use_for_success_labels: false
    #   bucket: home_real
    #   garment_type_name: Top_Long
    #   speed_factor: 1.5
    # Bucket B example — DAgger rollouts (per-frame weights from
    # task_is_policy + intervention distance; per-chunk speed factor from
    # dagger_human/auto_speed_factor):
    # - root: data/lehome_real/recorded/top_long_dagger_001
    #   repo_id: dagger_top_long_001
    #   is_real: true
    #   is_dagger: true
    #   use_for_success_labels: false
    #   bucket: home_real
    #   garment_type_name: Top_Long
    #   dagger_human_speed_factor: 2.0
    #   dagger_auto_speed_factor: 2.0
    # Bucket C example — sim success-replay rollouts in real schema
    # (collected via configs/rl_pipeline_sim_to_real.yaml):
    # - root: data/lehome_real_ds/simulations/rollout_xxx
    #   repo_id: sim_rollout_xxx
    #   is_real: true
    #   use_for_success_labels: false
    #   bucket: home_sim
    #   speed_factor: 0.65
